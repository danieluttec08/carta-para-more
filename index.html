<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Una carta para ti 💌</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  min-height:100vh;
  background:linear-gradient(120deg,#fbc2eb,#a6c1ee);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:'Inter',sans-serif;
  padding:20px;
}

/* Fondo partículas */
canvas{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

/* SOBRE */
.envelope{
  width:min(90vw,340px);
  height:min(60vw,220px);
  background:#fefefe;
  position:relative;
  border-radius:12px;
  cursor:pointer;
  box-shadow:0 25px 60px rgba(0,0,0,0.25);
  z-index:2;
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

.envelope::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  clip-path:polygon(0 0,100% 0,50% 55%);
  transition:0.8s;
  transform-origin:top;
  pointer-events:none;
}

.envelope.open::before{
  transform:rotateX(180deg);
}

.envelope::after{
  content:'';
  position:absolute;
  inset:0;
  border:2px solid rgba(255,255,255,0.6);
  border-radius:12px;
  pointer-events:none;
}

/* CARTA */
.letter{
  position:absolute;
  width:min(85vw,300px);
  min-height:360px;
  background:#fffaf0;
  top:15px;
  left:50%;
  transform:translateX(-50%) translateY(120px);
  border-radius:14px;
  padding:22px;
  text-align:center;
  opacity:0;
  transition:1.2s ease;
  z-index:5;
}

.envelope.open .letter{
  transform:translateX(-50%) translateY(-260px);
  opacity:1;
}

.letter h1{
  font-family:'Great Vibes',cursive;
  font-size:2em;
  color:#d6336c;
  margin-bottom:12px;
}

.typing{
  font-size:0.95em;
  color:#444;
  min-height:140px;
}

.question{
  display:none;
  margin-top:18px;
}

button{
  padding:10px 24px;
  border:none;
  border-radius:30px;
  font-size:0.95em;
  cursor:pointer;
  transition:0.3s;
  margin:6px;
}

#yes{
  background:#ff4d6d;
  color:white;
}

#no{
  background:#ddd;
  color:#555;
  position:relative;
}

.final{
  display:none;
  font-size:1.2em;
  margin-top:18px;
  color:#d6336c;
  animation:fadeIn 1.5s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:scale(0.9)}
  to{opacity:1; transform:scale(1)}
}

/* Corazones */
.heart{
  position:fixed;
  width:16px;
  height:16px;
  background:#ff4d6d;
  transform:rotate(45deg);
  animation:rise 6s linear infinite;
}

.heart::before,
.heart::after{
  content:'';
  position:absolute;
  width:16px;
  height:16px;
  background:#ff4d6d;
  border-radius:50%;
}

.heart::before{top:-8px;}
.heart::after{left:-8px;}

@keyframes rise{
  from{transform:translateY(0) rotate(45deg);opacity:1}
  to{transform:translateY(-120vh) rotate(45deg);opacity:0}
}

/* Responsive extra */
@media (max-width:480px){
  .letter h1{font-size:1.7em;}
  .final{font-size:1.05em;}
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="envelope" id="envelope">
  <div class="letter">
    <h1>Para More 💌</h1>
    <div class="typing" id="typing"></div>

    <div class="question" id="question">
      <p>¿Quieres ser mi San Valentín? 💖</p>
      <button id="yes">Sí 💕</button>
      <button id="no">No 😢</button>
    </div>

    <div class="final" id="final">
      💖 Prometo cuidarte, respetarte y amarte todos los días 💖
    </div>
  </div>
</div>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2022/02/23/audio_19d81c0b0f.mp3" type="audio/mpeg">
</audio>

<script>
const envelope = document.getElementById("envelope");
const typingDiv = document.getElementById("typing");
const question = document.getElementById("question");
const final = document.getElementById("final");
const music = document.getElementById("music");

const text = "Desde que llegaste a mi vida, More, cada día tiene más sentido. No hay momento en el que no piense en ti, y hoy solo quiero preguntarte algo desde el corazón...";

let i = 0;
let opened = false;

/* Abrir sobre una sola vez */
envelope.onclick = () => {
  if(opened) return;
  opened = true;
  envelope.classList.add("open");
  setTimeout(typeText,1200);
};

function typeText(){
  if(i < text.length){
    typingDiv.innerHTML += text.charAt(i);
    i++;
    setTimeout(typeText,40);
  } else {
    question.style.display = "block";
  }
}

/* Botón NO */
const noBtn = document.getElementById("no");
function moveNo(){
  noBtn.style.transform =
    `translate(${Math.random()*120-60}px,${Math.random()*80-40}px)`;
}
noBtn.addEventListener("mouseenter", moveNo);
noBtn.addEventListener("touchstart", moveNo);

/* Botón SÍ */
document.getElementById("yes").onclick = () => {
  question.style.display = "none";
  final.style.display = "block";
  music.play();
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
  rainHearts();
};

/* Corazones */
function rainHearts(){
  setInterval(()=>{
    const h = document.createElement("div");
    h.className = "heart";
    h.style.left = Math.random()*100 + "vw";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
  },200);
}

/* Partículas fondo */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
let w,h,particles=[];

function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

for(let i=0;i<60;i++){
  particles.push({
    x:Math.random()*w,
    y:Math.random()*h,
    r:Math.random()*2+1,
    dx:(Math.random()-0.5)*0.4,
    dy:(Math.random()-0.5)*0.4
  });
}

function animate(){
  ctx.clearRect(0,0,w,h);
  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,0.6)";
    ctx.fill();
    p.x+=p.dx; p.y+=p.dy;
    if(p.x<0||p.x>w) p.dx*=-1;
    if(p.y<0||p.y>h) p.dy*=-1;
  });
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
