<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para More 💌</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  min-height:100vh;
  background:linear-gradient(120deg,#fbc2eb,#a6c1ee);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:'Inter',sans-serif;
  padding:20px;
}

/* Fondo */
canvas{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

/* SOBRE */
.envelope{
  width:min(90vw,340px);
  height:min(60vw,220px);
  background:#fff;
  border-radius:14px;
  position:relative;
  cursor:pointer;
  z-index:2;
  box-shadow:0 25px 60px rgba(0,0,0,.25);
  animation:float 5s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.envelope::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  clip-path:polygon(0 0,100% 0,50% 55%);
  transform-origin:top;
  transition:1.2s;
  pointer-events:none;
}

.envelope.open::before{
  transform:rotateX(180deg);
}

.envelope::after{
  content:'';
  position:absolute;
  inset:0;
  border:2px solid rgba(255,255,255,.6);
  border-radius:14px;
  pointer-events:none;
}

/* CARTA */
.letter{
  position:absolute;
  width:min(85vw,300px);
  background:#fffaf0;
  top:15px;
  left:50%;
  transform:translateX(-50%) translateY(120px);
  border-radius:16px;
  padding:22px;
  text-align:center;
  opacity:0;
  transition:1.6s ease;
}

.envelope.open .letter{
  transform:translateX(-50%) translateY(-260px);
  opacity:1;
}

h1{
  font-family:'Great Vibes',cursive;
  font-size:2em;
  color:#d6336c;
  margin-bottom:10px;
}

.typing{
  font-size:.95em;
  color:#444;
  min-height:90px;
}

.question{display:none;margin-top:15px;}

button{
  padding:10px 24px;
  border:none;
  border-radius:30px;
  font-size:.95em;
  cursor:pointer;
  margin:6px;
  transition:.3s;
}

#yes{
  background:#ff4d6d;
  color:white;
}

#yes:hover,
#yes:active{
  background:#ff1e4d;
  transform:scale(1.05);
}

#no{
  background:#ddd;
  color:#555;
}

#no:hover,
#no:active{
  background:#bbb;
}

/* FINAL */
.final{
  display:none;
  margin-top:15px;
  font-size:1.15em;
  color:#d6336c;
  animation:fadeIn 1.5s ease;
}

/* CONTADOR */
.counter{
  display:none;
  margin-top:15px;
  font-size:.95em;
  color:#444;
}

.counter span{
  color:#ff4d6d;
  font-weight:600;
}

@keyframes fadeIn{
  from{opacity:0;transform:scale(.9)}
  to{opacity:1;transform:scale(1)}
}

/* Corazones */
.heart{
  position:fixed;
  width:16px;
  height:16px;
  background:#ff4d6d;
  transform:rotate(45deg);
  animation:rise 6s linear infinite;
}

.heart::before,
.heart::after{
  content:'';
  position:absolute;
  width:16px;
  height:16px;
  background:#ff4d6d;
  border-radius:50%;
}

.heart::before{top:-8px;}
.heart::after{left:-8px;}

@keyframes rise{
  from{transform:translateY(0) rotate(45deg);opacity:1}
  to{transform:translateY(-120vh) rotate(45deg);opacity:0}
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="envelope" id="envelope">
  <div class="letter">
    <h1>Para More 💌</h1>

    <div class="typing" id="typing"></div>

    <div class="question" id="question">
      <p>¿Quieres ser mi San Valentín? 💖</p>
      <button id="yes">Sí 💕</button>
      <button id="no">No 😢</button>
    </div>

    <div class="final" id="final">
      💖 Prometo cuidarte y hacerte sonreír todos los días 💖
    </div>

    <div class="counter" id="counter">
      💘 Llevamos <span id="days"></span> días juntos 💘
    </div>
  </div>
</div>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_56c60b29c5.mp3">
</audio>

<script>
const envelope = document.getElementById("envelope");
const typing = document.getElementById("typing");
const question = document.getElementById("question");
const final = document.getElementById("final");
const counter = document.getElementById("counter");
const daysSpan = document.getElementById("days");
const music = document.getElementById("music");

const text = "Desde que llegaste a mi vida, todo es más bonito. Hoy solo quiero preguntarte algo desde el corazón...";

let i=0, opened=false;

envelope.onclick=()=>{
  if(opened) return;
  opened=true;
  envelope.classList.add("open");
  setTimeout(typeText,1500);
};

function typeText(){
  if(i<text.length){
    typing.innerHTML+=text.charAt(i);
    i++;
    setTimeout(typeText,55);
  }else{
    question.style.display="block";
  }
}

/* NO */
const noBtn=document.getElementById("no");
function moveNo(){
  noBtn.style.transform=`translate(${Math.random()*120-60}px,${Math.random()*80-40}px)`;
}
noBtn.addEventListener("mouseenter",moveNo);
noBtn.addEventListener("touchstart",moveNo);

/* SI */
document.getElementById("yes").onclick=()=>{
  question.style.display="none";
  final.style.display="block";
  counter.style.display="block";
  music.play();
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
  calcDays();
  rainHearts();
};

/* CONTADOR */
function calcDays(){
  const start = new Date("2024-07-28");
  const now = new Date();
  const diff = Math.floor((now - start) / (1000*60*60*24));
  daysSpan.textContent = diff;
}

/* Corazones */
function rainHearts(){
  setInterval(()=>{
    const h=document.createElement("div");
    h.className="heart";
    h.style.left=Math.random()*100+"vw";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
  },220);
}

/* Partículas */
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");
let w,h,particles=[];
function resize(){
  w=canvas.width=window.innerWidth;
  h=canvas.height=window.innerHeight;
}
resize();window.onresize=resize;

for(let i=0;i<50;i++){
  particles.push({
    x:Math.random()*w,
    y:Math.random()*h,
    r:Math.random()*2+1,
    dx:(Math.random()-.5)*.3,
    dy:(Math.random()-.5)*.3
  });
}

(function animate(){
  ctx.clearRect(0,0,w,h);
  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,.6)";
    ctx.fill();
    p.x+=p.dx;p.y+=p.dy;
    if(p.x<0||p.x>w)p.dx*=-1;
    if(p.y<0||p.y>h)p.dy*=-1;
  });
  requestAnimationFrame(animate);
})();
</script>

</body>
</html>
